
<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            margin-top:100px;
        }

        .box{
            background:white;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        textarea{
            width:100%;
            height:100px;
            padding:10px;
        }

        button{
            padding:10px 20px;
            margin-top:15px;
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            color:green;
        }
    </style>

</head>

<body>

<div class="box">

    <h1>Spam Message Detector</h1>

    <form method="POST">

        <textarea name="message" placeholder="Enter message"></textarea>

        <br>

        <button type="submit">Check Message</button>

    </form>

    <h2>{{ result }}</h2>

</div>

</body>
</html>
